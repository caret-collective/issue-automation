name: On Issue Closed
description: Clears the Stage field when an issue is closed.
inputs:
  stage_field_id:
    description: Numeric ID of the Stage issue field.
    required: true
runs:
  using: composite
  steps:
    - name: Debug inputs
      if: runner.debug == '1'
      shell: bash
      env:
        FIELD_ID: ${{ inputs.stage_field_id }}
      run: |
        echo "stage_field_id: $FIELD_ID"
        echo "repository: ${{ github.repository }}"
        echo "issue_number: ${{ github.event.issue.number }}"

    - name: Issue closed → Clear Stage
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN || github.token }}
        GH_API_VERSION: ${{ env.GH_API_VERSION || '2026-03-10' }}
        REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        FIELD_ID: ${{ inputs.stage_field_id }}
      run: |
        if [ -z "$FIELD_ID" ]; then
          echo "::notice::stage_field_id is not set. Skipping."
          exit 0
        fi

        gh api -X DELETE \
          -H "X-GitHub-Api-Version: $GH_API_VERSION" \
          "/repos/$REPO/issues/$ISSUE_NUMBER/issue-field-values/$FIELD_ID" \
          || {
            echo "::error::Request failed. See the troubleshooting section in the README for help."
            exit 1
          }
