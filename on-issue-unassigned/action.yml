name: On Issue Unassigned
description: >-
  Sets the Stage field to ready when all assignees are removed from an issue.
  If the issue still has remaining assignees after this event, the action does nothing.
inputs:
  stage_field_id:
    description: Numeric ID of the Stage issue field.
    required: true
  stage_ready_value:
    description: Option name for the ready stage.
    required: true
runs:
  using: composite
  steps:
    - name: Debug inputs
      if: runner.debug == '1'
      shell: bash
      env:
        FIELD_ID: ${{ inputs.stage_field_id }}
        VALUE: ${{ inputs.stage_ready_value }}
        ASSIGNEES: ${{ toJSON(github.event.issue.assignees) }}
      run: |
        echo "stage_field_id: $FIELD_ID"
        echo "stage_ready_value: $VALUE"
        echo "repository: ${{ github.repository }}"
        echo "issue_number: ${{ github.event.issue.number }}"
        echo "remaining_assignees: $(echo "${ASSIGNEES:-[]}" | jq 'length')"

    - name: 'Issue unassigned → Set Stage to ${{ inputs.stage_ready_value }}'
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN || github.token }}
        GH_API_VERSION: ${{ env.GH_API_VERSION || '2026-03-10' }}
        REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        FIELD_ID: ${{ inputs.stage_field_id }}
        VALUE: ${{ inputs.stage_ready_value }}
        ASSIGNEES: ${{ toJSON(github.event.issue.assignees) }}
      run: |
        if [ -z "$FIELD_ID" ]; then
          echo "::notice::stage_field_id is not set. Skipping."
          exit 0
        fi

        # github.event.issue.assignees reflects the state *after* this event,
        # so an empty array means this was the last assignee removed.
        ASSIGNEE_COUNT=$(echo "${ASSIGNEES:-[]}" | jq 'length')
        if [ "$ASSIGNEE_COUNT" -ne 0 ]; then
          echo "Issue still has $ASSIGNEE_COUNT assignee(s). Skipping."
          exit 0
        fi

        BODY=$(jq -n \
          --argjson field_id "$FIELD_ID" \
          --arg value "$VALUE" \
          '{"issue_field_values":[{"field_id":$field_id,"value":$value}]}')

        gh api -X POST \
          -H "X-GitHub-Api-Version: $GH_API_VERSION" \
          "/repos/$REPO/issues/$ISSUE_NUMBER/issue-field-values" \
          --input - <<< "$BODY" \
          || {
            echo "::error::Request failed. See the troubleshooting section in the README for help."
            exit 1
          }
