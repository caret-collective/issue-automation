name: On Issue Assigned
description: Sets the Stage field to in progress when an issue is assigned.
inputs:
  stage_field_id:
    description: Numeric ID of the Stage issue field.
    required: true
  stage_in_progress_value:
    description: Option name for the in-progress stage.
    required: true
runs:
  using: composite
  steps:
    - name: Debug inputs
      if: runner.debug == '1'
      shell: bash
      env:
        FIELD_ID: ${{ inputs.stage_field_id }}
        VALUE: ${{ inputs.stage_in_progress_value }}
      run: |
        echo "stage_field_id: $FIELD_ID"
        echo "stage_in_progress_value: $VALUE"
        echo "repository: ${{ github.repository }}"
        echo "issue_number: ${{ github.event.issue.number }}"

    - name: 'Issue assigned → Set Stage to ${{ inputs.stage_in_progress_value }}'
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN || github.token }}
        GH_API_VERSION: ${{ env.GH_API_VERSION || '2026-03-10' }}
        REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        FIELD_ID: ${{ inputs.stage_field_id }}
        VALUE: ${{ inputs.stage_in_progress_value }}
      run: |
        if [ -z "$FIELD_ID" ]; then
          echo "::notice::stage_field_id is not set. Skipping."
          exit 0
        fi

        BODY=$(jq -n \
          --argjson field_id "$FIELD_ID" \
          --arg value "$VALUE" \
          '{"issue_field_values":[{"field_id":$field_id,"value":$value}]}')

        gh api -X POST \
          -H "X-GitHub-Api-Version: $GH_API_VERSION" \
          "/repos/$REPO/issues/$ISSUE_NUMBER/issue-field-values" \
          --input - <<< "$BODY" \
          || {
            echo "::error::Request failed. See the troubleshooting section in the README for help."
            exit 1
          }
